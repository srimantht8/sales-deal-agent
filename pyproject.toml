[project]
name = "sales-deal-agent"
version = "0.1.0"
description = "Sales Deal Acceleration Agent — LangGraph multi-system workflow orchestration"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.13",
    "langchain-core>=0.3.28",
    "langchain-community>=0.3.13",
    "langgraph>=0.2.60",
    "langchain-aws>=0.2.12",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-vertexai>=2.0.0",
    "langsmith>=0.2.10",
    "langchain-tavily>=0.1.0",
    "faiss-cpu>=1.9.0",
    "tavily-python>=0.5.0",
    "ddgs>=9.0.0",
    "boto3>=1.35.0",
    "streamlit>=1.41.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["agent*", "tools*", "config*", "eval*", "scripts*", "ui*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
